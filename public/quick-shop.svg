<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Inter, Arial, sans-serif">
  <title>Quick Shop template preview</title>
  <rect width="640" height="480" fill="#f4f6fa"/>
  <rect x="24" y="24" width="592" height="432" rx="18" fill="#f4f5f7"/>
  <!-- top progress: milestones -->
  <rect x="36" y="36" width="568" height="78" rx="12" fill="#ffffff"/>
  <text x="52" y="56" font-size="9" font-weight="800" letter-spacing="1.2" fill="#6b7280">UNLOCK OFFERS ON YOUR BOX</text>
  <text x="52" y="72" font-size="11" font-weight="700" fill="#16a34a">You unlocked 5% OFF · Add 2 items more to unlock 10% OFF</text>
  <rect x="64" y="88" width="512" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="64" y="88" width="340" height="6" rx="3" fill="#2563eb"/>
  <circle cx="320" cy="91" r="10" fill="#16a34a"/><text x="320" y="95" font-size="10" text-anchor="middle">🎁</text>
  <circle cx="576" cy="91" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="576" y="95" font-size="10" text-anchor="middle">🚚</text>
  <!-- filters -->
  <rect x="36" y="124" width="30" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="51.0" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">⚙</text>
  <rect x="72" y="124" width="41" height="22" rx="11" fill="#eff6ff" stroke="#2563eb"/>
  <text x="92.5" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#2563eb">All</text>
  <rect x="119" y="124" width="69" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="153.5" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">Chicken</text>
  <rect x="194" y="124" width="62" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="225.0" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">Mutton</text>
  <rect x="262" y="124" width="62" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="293.0" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">Type ▾</text>
  <rect x="330" y="124" width="69" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="364.5" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">Brand ▾</text>
  <rect x="405" y="124" width="83" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="446.5" y="139" font-size="10" font-weight="600" text-anchor="middle" fill="#111827">Sort By ▾</text>
  <!-- cards -->
  <rect x="44" y="156" width="140" height="200" rx="12" fill="#ffffff"/>
  <rect x="52" y="164" width="124" height="104" rx="10" fill="#fde2e2"/>
  <rect x="52" y="252" width="124" height="16" fill="#3b82f6"/><text x="58" y="264" font-size="9" font-weight="800" fill="#fff">Bestseller</text>
  <rect x="120" y="170" width="50" height="22" rx="7" fill="#2563eb"/><text x="145" y="185" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">−  1  +</text>
  <text x="54" y="284" font-size="8" font-weight="800" fill="#6b7280">8 MINS</text>
  <text x="54" y="298" font-size="11" font-weight="600" fill="#111827">Curry Cut</text>
  <text x="54" y="314" font-size="10" fill="#2563eb">500 g ▾</text>
  <text x="54" y="330" font-size="10" font-weight="800" fill="#16a34a">6% OFF</text>
  <text x="54" y="347" font-size="13" font-weight="800" fill="#111827">₹168</text>
  <text x="94" y="347" font-size="10" fill="#9ca3af" text-decoration="line-through">₹179</text>
  <rect x="196" y="156" width="140" height="200" rx="12" fill="#ffffff"/>
  <rect x="204" y="164" width="124" height="104" rx="10" fill="#fde8d7"/>
  <rect x="298" y="170" width="24" height="24" rx="7" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><text x="310" y="187" font-size="16" font-weight="700" text-anchor="middle" fill="#2563eb">+</text>
  <text x="206" y="284" font-size="8" font-weight="800" fill="#6b7280">8 MINS</text>
  <text x="206" y="298" font-size="11" font-weight="600" fill="#111827">Breast</text>
  <text x="206" y="314" font-size="10" fill="#2563eb">500 g ▾</text>
  <text x="206" y="347" font-size="13" font-weight="800" fill="#111827">₹259</text>
  <rect x="348" y="156" width="140" height="200" rx="12" fill="#ffffff"/>
  <rect x="356" y="164" width="124" height="104" rx="10" fill="#f3e8ff"/>
  <rect x="424" y="170" width="50" height="22" rx="7" fill="#2563eb"/><text x="449" y="185" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">−  2  +</text>
  <text x="358" y="284" font-size="8" font-weight="800" fill="#6b7280">8 MINS</text>
  <text x="358" y="298" font-size="11" font-weight="600" fill="#111827">Mutton</text>
  <text x="358" y="314" font-size="10" fill="#2563eb">500 g ▾</text>
  <text x="358" y="330" font-size="10" font-weight="800" fill="#16a34a">10% OFF</text>
  <text x="358" y="347" font-size="13" font-weight="800" fill="#111827">₹449</text>
  <text x="398" y="347" font-size="10" fill="#9ca3af" text-decoration="line-through">₹499</text>
  <rect x="500" y="156" width="140" height="200" rx="12" fill="#ffffff"/>
  <rect x="508" y="164" width="124" height="104" rx="10" fill="#e0f2fe"/>
  <rect x="602" y="170" width="24" height="24" rx="7" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><text x="614" y="187" font-size="16" font-weight="700" text-anchor="middle" fill="#2563eb">+</text>
  <text x="510" y="284" font-size="8" font-weight="800" fill="#6b7280">8 MINS</text>
  <text x="510" y="298" font-size="11" font-weight="600" fill="#111827">Drumsticks</text>
  <text x="510" y="314" font-size="10" fill="#2563eb">500 g ▾</text>
  <text x="510" y="330" font-size="10" font-weight="800" fill="#16a34a">13% OFF</text>
  <text x="510" y="347" font-size="13" font-weight="800" fill="#111827">₹199</text>
  <text x="550" y="347" font-size="10" fill="#9ca3af" text-decoration="line-through">₹229</text>
  <!-- bottom bar -->
  <rect x="96" y="366" width="448" height="80" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="122" cy="386" r="12" fill="#16a34a"/><text x="122" y="390" font-size="12" text-anchor="middle">🎉</text>
  <text x="142" y="390" font-size="12" fill="#111827">You unlocked <tspan font-weight="800">5% OFF</tspan></text>
  <line x1="112" y1="404" x2="528" y2="404" stroke="#e5e7eb"/>
  <rect x="112" y="412" width="26" height="26" rx="7" fill="#fde2e2" stroke="#fff" stroke-width="2"/>
  <rect x="124" y="412" width="26" height="26" rx="7" fill="#f3e8ff" stroke="#fff" stroke-width="2"/>
  <text x="160" y="424" font-size="12" font-weight="700" fill="#111827">3 Items ⌃</text>
  <text x="160" y="438" font-size="10" font-weight="700" fill="#16a34a">₹92 saved, more coming up!</text>
  <rect x="436" y="412" width="92" height="28" rx="9" fill="#2563eb"/>
  <text x="482" y="430" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">Go to Cart</text>
</svg>
