api_version = "2026-07"
uid = "09a6f51e-e2ed-7226-bc70-b175876f2a2a83c6438b"

[[extensions]]
name = "BRIX prepaid discount"
handle = "brix-prepaid-discount"
type = "function"
description = "Gives the merchant's prepaid (pay online) percentage off at Shopify checkout. Never applies to BRIX Cash on Delivery orders."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  # $collectionIds for the input query: the collections the merchant left out
  # of the prepaid discount, written to the discount by
  # app/services/prepaid-discount-shopify.server.js.
  [extensions.input.variables]
  namespace = "$app"
  key = "prepaid_discount_vars"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
