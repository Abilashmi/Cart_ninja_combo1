query Input($collectionIds: [ID!]) {
  enteredDiscountCodes {
    code
  }
  cart {
    cod: attribute(key: "_brixCod") { value }
    lines {
      id
      cod: attribute(key: "_brixCod") { value }
      reward: attribute(key: "_brixReward") { value }
      combo: attribute(key: "_brix_combo_id") { value }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            inCollections(ids: $collectionIds) {
              isMember
            }
          }
        }
      }
      cost {
        subtotalAmount {
          amount
          currencyCode
        }
      }
    }
  }
  discount {
    discountClasses
  }
  shop {
    metafield(namespace: "$app", key: "prepaid_discount_config") {
      jsonValue
    }
  }
}
