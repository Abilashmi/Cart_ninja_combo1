api_version = "2026-07"
uid = "9c59b3e4-1975-ace6-63b8-ae5e0f62e74e3df2f9d7"

[[extensions]]
name = "BRIX Packs discount"
handle = "brix-packs-discount"
type = "function"
description = "Applies BRIX Pack quantity-tier discounts to marked cart lines at checkout."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  # $collectionIds for the input query: every collection a Pack used on many
  # products covers, written to the discount by app/services/packs-shopify.server.js.
  [extensions.input.variables]
  namespace = "$app"
  key = "packs_vars"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
