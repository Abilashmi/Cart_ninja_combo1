query Input {
  cart {
    lines {
      id
      quantity
      reward: attribute(key: "_brixReward") { value }
      pack: attribute(key: "_brix_pack_id") { value }
      combo: attribute(key: "_brix_combo_id") { value }
      cost {
        subtotalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
  shop {
    metafield(namespace: "$app", key: "fbt_offer_config") {
      jsonValue
    }
  }
}
